<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>UVT userscript fixture — mocked local server</title>
<style>body{margin:0;background:#101724;color:#dce8f8;font:16px/1.5 system-ui}main{max-width:960px;margin:70px auto;padding:20px}video{display:block;width:100%;height:540px;background:linear-gradient(125deg,#314360,#152234);border-radius:18px}h1{font-size:22px}@media(max-width:600px){main{margin:10px auto}video{height:260px}}</style>
<main><h1>Локальная проверка UVT · без моделей и загрузки видео</h1><video controls muted></video><p>Сервер в этой странице имитируется. Это проверка интерфейса, а не скорости перевода.</p></main>
<script>
const nativeFetch = window.fetch.bind(window);
window.uvtObservedResource = [{name:'https://cdn.example.test/early/master.m3u8',startTime:1}];
window.PerformanceObserver = class {constructor(callback) { this.callback=callback; } observe(){this.callback({getEntries:()=>window.uvtObservedResource});}};
const preferences = new Map();
window.GM_getValue = (key, fallback) => preferences.has(key) ? preferences.get(key) : fallback;
window.GM_setValue = (key, value) => preferences.set(key, value);
window.uvtFixture = { requests: [], unavailable: false, clips: false };
const profiles = [
  {id:'local-fast',label:'Быстро',installed:true,engines:{stt:'parakeet-mlx',translation:'nllb',tts:'piper'}},
  {id:'local-balanced',label:'Сбалансированный',installed:true,engines:{stt:'parakeet-mlx',translation:'translategemma-mlx',tts:'piper'}},
  {id:'local-quality',label:'Качество',installed:false,engines:{stt:'mlx-whisper',translation:'translategemma-mlx',tts:'piper'}},
  {id:'local-natural',label:'Естественные голоса',installed:true,engines:{stt:'parakeet-mlx',translation:'mlx-chat',tts:'f5'}},
  {id:'unknown',label:'Неизвестный профиль'}
];
window.fetch = async (input, options = {}) => {
  const url = new URL(String(input), location.href);
  if (url.hostname !== '127.0.0.1' || !['8765','8766','8767'].includes(url.port)) return nativeFetch(input, options);
  if (window.uvtFixture.unavailable) throw new TypeError('Failed to fetch');
  if (options.body) window.uvtFixture.requests.push({path:url.pathname, body:JSON.parse(options.body)});
  let data;
  if (url.pathname === '/meta') {
    const profile = profiles.find(p => p.id === url.searchParams.get('profile_id')) || profiles[1];
    const target = url.searchParams.get('target_lang') || 'uk';
    data = {api_version:2,mode:'batch',capabilities:{profile_selection:true,voice_selection:true,tts_preview:true},profile:{name:profile.id,source_lang:'en',target_lang:target,engines:profile.engines},defaults:{profile_id:'local-balanced',voice_gender:'female',voice_id:'uk_UA-tetiana-high'},profiles,voices:[
      {id:'ru_RU-dmitri-medium',label:'Дмитрий',language:'ru',gender:'male',installed:true},
      {id:'ru_RU-irina-medium',label:'Ирина',language:'ru',gender:'female',installed:true},
      {id:'uk_UA-mykyta-high',label:'Микита',language:'uk',gender:'male',installed:true},
      {id:'uk_UA-tetiana-high',label:'Тетяна',language:'uk',gender:'female',installed:true}],limits:{local_tts_languages:['ru','uk']},model_readiness:{status:'on-demand',detail:'Модели загрузятся при запуске'},privacy:{data_leaves_device:false}};
  } else if (url.pathname === '/dub') data = {id:'fixture-job',mode:'batch',status:'queued',stage:'queue',progress:0};
  else if (url.pathname.endsWith('/cancel')) data = {status:'cancelled'};
  else data = {id:'fixture-job',mode:'batch',status:'running',stage:'transcribe',progress:.25,stage_progress:.5,eta_seconds:null};
  return new Response(JSON.stringify(data), {headers:{'Content-Type':'application/json'}});
};
</script>
<script src="../uvt.user.js"></script>
</html>
