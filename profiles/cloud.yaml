# Совместимый профиль для старой команды `-p cloud`.
# Новые команды: `-p cloud-fast` (меньше задержка) и `-p cloud-quality`
# (пакетный дубляж с упором на качество). Этот профиль эквивалентен cloud-fast.
# Аудио, текст и синтез отправляются в OpenAI; нужен OPENAI_API_KEY.
mode: voiceover
source_lang: auto
target_lang: ru
vad:
  engine: silero
stt:
  engine: openai-compatible
  base_url: https://api.openai.com/v1
  api_key_env: OPENAI_API_KEY
  model: gpt-4o-mini-transcribe
  # При HTTP/timeout/отказе облака не скачиваем ролик заново: продолжаем уже
  # декодированный звук локальным Whisper.
  fallback:
    engine: faster-whisper
    model: small
    device: auto
    compute_type: auto
translation:
  engine: openai-compatible
  base_url: https://api.openai.com/v1
  model: gpt-4o-mini
  api_key_env: OPENAI_API_KEY
  temperature: 0.2
  # Локальный резерв. Подготовка один раз: `ollama pull qwen2.5:3b`.
  # OPENAI_API_KEY намеренно не наследуется локальному endpoint.
  fallback:
    engine: openai-compatible
    base_url: http://127.0.0.1:11434/v1
    api_key_env: UVT_OLLAMA_API_KEY
    model: qwen2.5:3b
    temperature: 0.2
    timeout_s: 90
tts:
  engine: openai
  base_url: https://api.openai.com/v1
  api_key_env: OPENAI_API_KEY
  model: tts-1
  voice: auto            # тембр-эвристика, не точное определение спикера
output:
  # Совместимый alias cloud-fast: окно live-озвучки 2–4 с, старые реплики
  # отбрасываются вместо накапливания за свежей речью.
  target_delay_s: 2.0
  max_backlog_s: 2.0
  latest_wins: true
latency:
  preset: ultra
history:
  enabled: false
