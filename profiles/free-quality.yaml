# Оптимальный private-local маршрут для Apple Silicon с 8 ГБ unified memory.
# Тяжёлые стадии выполняются последовательно в одном UVT-процессе:
# MLX Whisper → NLLB INT8 → Piper. Ollama и внешние API не нужны.
#
# Однократная подготовка:
#   pip install -e ".[mac-local,server,web]"
#   uvt setup-mac-local --preset all
mode: voiceover
source_lang: auto
target_lang: ru

vad:
  engine: silero

stt:
  engine: mlx-whisper
  model: large-v3-turbo
  revision: a4aaeec0636e6fef84abdcbe3544cb2bf7e9f6fb
  allow_download: false

translation:
  engine: nllb-ct2
  model: OpenNMT/nllb-200-distilled-1.3B-ct2-int8
  revision: 70f572adafa4794890ce7826156a4209717855af
  allow_download: false
  compute_type: int8
  threads: 4
  batch_size: 32
  concurrency: 1
  beam_size: 1

tts:
  engine: piper
  voice_dir: ~/.local/share/uvt/piper
  voice_models:
    "uk:male": uk_UA-mykyta-high.onnx
    "uk:female": uk_UA-tetiana-high.onnx
    "ru:male": ru_RU-dmitri-medium.onnx
    "ru:female": ru_RU-irina-medium.onnx
  # Эмпирическая длительность этих голосов: позволяет сразу выбрать темп,
  # вместо повторного синтеза сотен не поместившихся в таймкод реплик.
  duration_per_char:
    "uk:male": 0.082
    "uk:female": 0.065
    "ru:male": 0.055
    "ru:female": 0.067
  concurrency: 2

latency:
  preset: accuracy

history:
  enabled: true
