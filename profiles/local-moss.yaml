# Local CPU voice cloning on M4: Parakeet → Hy-MT2 → MOSS-TTS-Nano ONNX.
# Russian supported; select local-hymt/Piper for Ukrainian. No Demucs required.
mode: voiceover
source_lang: auto
target_lang: ru
vad:
  engine: silero
stt:
  engine: parakeet-mlx
  model: mlx-community/parakeet-tdt-0.6b-v3
  revision: ed2b7e8c15f9aaa0b5772e2efb986255eaef7e15
  allow_download: false
  chunk_seconds: 90
  overlap_seconds: 15
  concurrency: 1
translation:
  engine: hymt-mlx
  model: .models/hymt2
  revision: e5c6fe56c7b3bc77fae5ae92db31f2178f1e6912
  allow_download: false
  batch_size: 4
  concurrency: 1
  max_tokens: 160
  context_pairs: 2
tts:
  engine: moss-onnx
  model_path: .models/moss-tts
  codec_path: .models/moss-codec
  sample_mode: fixed
  threads: 4
  concurrency: 1
  max_text_tokens: 75
  max_new_frames: 375

latency:
  preset: balanced
history:
  enabled: true
