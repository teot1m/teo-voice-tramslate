[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uvt"
version = "0.2.0"
description = "Universal Voice Translator — закадровый AI-перевод любого видео и звука: кнопка в браузере, дубляж файлов, живой режим"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "UVT contributors" }]
keywords = [
    "translation", "voice-over", "dubbing", "speech", "whisper", "tts",
    "vad", "realtime", "ollama", "userscript",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

# Ядро специально лёгкое: тяжёлые движки (Whisper, ONNX, TTS) — в extras,
# их модули импортируются лениво, приложение работает и без них.
dependencies = [
    "numpy>=1.24",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "soxr>=0.3.7",
    "httpx>=0.27",
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
stt = ["faster-whisper>=1.0.0"]
mlx = ["mlx-whisper>=0.4.0; sys_platform == 'darwin'"]
vad = ["onnxruntime>=1.17"]
tts = ["edge-tts>=6.1.9"]
kokoro = ["kokoro-onnx>=0.4.0"]
webrtc = ["webrtcvad>=2.0.10"]
server = ["aiohttp>=3.9"]
web = ["yt-dlp>=2024.4.9"]
gui = ["PySide6>=6.6"]
windows = ["PyAudioWPatch>=0.2.12; sys_platform == 'win32'"]
# Рекомендуемый рабочий набор MVP: локальный Whisper + Silero VAD + Edge TTS
recommended = [
    "faster-whisper>=1.0.0",
    "onnxruntime>=1.17",
    "edge-tts>=6.1.9",
]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "aiohttp>=3.9"]

[project.scripts]
uvt = "uvt.cli:main"

[project.urls]
Homepage = "https://github.com/uvt-project/uvt"

[tool.hatch.build.targets.wheel]
packages = ["src/uvt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
